// ============================================================================
// QuackPack radiation fields for Kerbalism
//
// Geometry values are in body radii measured from the body centre.
// Radiation values are in rad/hour.
//
// Kerbalism geometry notes (Kerbalism 3.x, Radiation.cs):
// - Belts are tori: ring radius = *_dist / sqrt(*_deform_xy), tube radius = *_radius.
// - +x points at the star. Dayside distances are divided by *_compression,
//   nightside distances by *_extension (values < 1 stretch the nightside).
// - Magnetopause: dayside = pause_radius / pause_compression,
//   nightside = pause_radius / pause_extension,
//   poles = pause_radius / pause_height_scale, dawn/dusk = pause_radius.
// - A field is only evaluated inside its body's SOI, so every magnetopause
//   (nightside included) is kept inside the SOI to stay a crossable boundary.
// - A body's own radiation_surface only reaches vessels orbiting *other*
//   bodies (its moons) and the landed/body-info estimate.
//
// Shielding (radiation_pause) convention -- a gameplay heuristic, not a
// physical transmission law:
// radiation_pause is a flat additive term. Near Kerbol the stellar term is
// large (Sun radiation_surface 27 rad/h scaled by (R_sun / orbit)^2), so the
// stock-sized values (-0.002..-0.012) would do nothing here. Each value below
// is sized so that, deep inside the magnetosphere and outside the belts, a
// quiet-Sun vessel receives a fraction T of the local interplanetary dose
// (star + 0.04 cosmic - 0.025 heliopause), anchored to stock Kerbin
// (0.014 / 0.025 = ~56% at ~0.3 G). T borrows the B^(1/3) scaling of a
// magnetopause stand-off distance as a convenient monotonic rule:
// T ~ 0.56 * (0.3 G / B)^(1/3). Calibrated at each body's semimajor axis:
//   Blas  ~0.15 G -> T ~0.70 -> 0.33 rad/h left of 0.47 rad/h
//   Jot   ~2 G    -> T ~0.30 -> 0.35 rad/h left of 1.17 rad/h
//   Cind  ~0.40 G -> T ~0.50 -> 2.5 rad/h left of 5.0 rad/h
// Solar activity raises the stellar term by up to 30%; planetary shielding
// does not scale with it.
//
// Design basis:
// - Blas: weak/moderate dynamo; metal-poor super-Kerbin.
// - Jot: strong giant-planet dynamo, compressed by stellar wind.
// - Cind: metal-rich, rapidly rotating synchronous world; strong intrinsic
//         dynamo, but heavily compressed by the stellar wind.
// - Geet/Subon: no independent global field; they inherit parent-chain fields.
// ============================================================================


// ============================================================================
// BLAS
// Radius: 811 km, atmosphere 80 km (~1.10 Rp), SOI ~22 Rp
// Rotation: ~17.13 h
// Rings: 2.35-4.00 Rp (innermost ring 2.35-2.95 Rp)
// Nominal field assumption: ~0.15 G equatorial
// Inner belt: 1.25-2.05 Rp at dawn/dusk, 1.16-1.90 Rp noon, 1.52-2.50 Rp
//             night (reaches the innermost ring only on the nightside).
// Outer belt: 2.30-4.00 Rp at dawn/dusk, 2.19-3.81 Rp noon, 2.71-4.71 Rp night.
// Low Blas orbit and the poles stay clear of both belts.
// Magnetopause: ~4.24 Rp dayside, 6.15 Rp dawn/dusk, 20.5 Rp nightside.
// Geet (~3.62 Rp) stays inside the outer belt along its whole orbit.
// ============================================================================
RadiationModel:NEEDS[QuackPack,Kerbalism,FeatureRadiation]
{
    name = QP_Blas

    has_inner = true
    inner_dist = 1.65
    inner_radius = 0.40
    inner_compression = 1.08
    inner_extension = 0.82
    inner_quality = 30

    has_outer = true
    outer_dist = 3.15
    outer_radius = 0.85
    outer_compression = 1.05
    outer_extension = 0.85
    outer_deform = 0.03
    outer_quality = 30

    has_pause = true
    pause_radius = 6.15
    pause_compression = 1.45
    pause_extension = 0.30
    pause_height_scale = 1.10
    pause_quality = 20
}


// ============================================================================
// JOT
// Radius: 8,339 km, atmosphere 1,200 km (~1.14 Rp), SOI only ~6.19 Rp
// Rotation: ~21.46 h
// Nominal field assumption: ~2 G equatorial
// Inner belt: 1.25-2.15 Rp at dawn/dusk, lowest edge ~1.19 Rp at noon.
// Outer belt: 2.50-4.30 Rp at dawn/dusk, 2.27-3.91 Rp noon, 2.94-5.06 Rp night.
// Magnetopause: ~5.22 Rp dayside, 6.0 Rp dawn/dusk and nightside. The small
// SOI leaves no room for a long magnetotail.
// Subon orbits at ~1.67 Jot radii, inside the inner radiation belt
// (cf. OPM's Hale/Ovok inside Sarnus' 150 rad/h belt).
// ============================================================================
RadiationModel:NEEDS[QuackPack,Kerbalism,FeatureRadiation]
{
    name = QP_Jot

    has_inner = true
    inner_dist = 1.70
    inner_radius = 0.45
    inner_compression = 1.05
    inner_extension = 0.80
    inner_quality = 30

    has_outer = true
    outer_dist = 3.40
    outer_radius = 0.90
    outer_compression = 1.10
    outer_extension = 0.85
    outer_quality = 30

    has_pause = true
    pause_radius = 6.00
    pause_compression = 1.15
    pause_extension = 1.00
    pause_height_scale = 1.10
    pause_quality = 20
}


// ============================================================================
// CIND
// Radius: 571 km, atmosphere 100 km (~1.18 Rp), SOI ~6.67 Rp
// Tidally locked, with an orbital/rotation period of ~24.1 h.
// Large metal core supports a plausible active dynamo.
// Nominal field assumption: ~0.40 G equatorial
// Inner belt: 1.50-2.20 Rp at dawn/dusk, lowest edge 1.25 Rp (~143 km) at noon.
// Outer belt: thin ring, 2.12-2.52 Rp noon, 3.31-3.94 Rp night.
// Magnetopause: ~3.87 Rp dayside, ~4.3 Rp poles, 6.0 Rp dawn/dusk/nightside.
// Extreme stellar wind strongly compresses and distorts the magnetosphere.
// ============================================================================
RadiationModel:NEEDS[QuackPack,Kerbalism,FeatureRadiation]
{
    name = QP_Cind

    has_inner = true
    inner_dist = 1.85
    inner_radius = 0.35
    inner_compression = 1.20
    inner_extension = 0.75
    inner_deform = 0.03
    inner_quality = 40

    has_outer = true
    outer_dist = 2.90
    outer_radius = 0.25
    outer_compression = 1.25
    outer_extension = 0.80
    outer_deform = 0.05
    outer_quality = 30

    has_pause = true
    pause_radius = 6.00
    pause_compression = 1.55
    pause_extension = 1.00
    pause_height_scale = 1.40
    pause_deform = 0.15
    pause_quality = 30
}


// ============================================================================
// RadiationBody definitions
// ============================================================================
RadiationBody:NEEDS[QuackPack,Kerbalism,FeatureRadiation]
{
    name = Blas
    radiation_model = QP_Blas

    radiation_inner = 6.00
    radiation_inner_gradient = 3.3
    radiation_outer = 1.70
    radiation_outer_gradient = 2.2

    // Weak/moderate field: T ~0.70. Low Blas orbit, quiet Sun: ~0.33 rad/h
    // at the semimajor axis (~0.30 at apoapsis).
    // No intrinsic surface radiation source.
    radiation_pause = -0.14
    radiation_surface = 0
}

// Geet has no independent global magnetosphere.
// Its radiation environment is dominated by Blas and the star.
RadiationBody:NEEDS[QuackPack,Kerbalism,FeatureRadiation]
{
    name = Geet
    radiation_surface = 0
}

RadiationBody:NEEDS[QuackPack,Kerbalism,FeatureRadiation]
{
    name = Jot
    radiation_model = QP_Jot

    // ~0.6x stock Jool (200 / 11), keeping a Jool-like inner/outer ratio.
    radiation_inner = 120
    radiation_inner_gradient = 3.3
    radiation_outer = 7
    radiation_outer_gradient = 2.2

    // Strong but compressed field: T ~0.30, ~0.35 rad/h in low Jot orbit.
    // radiation_surface only reaches Subon (~3.2 rad/h at its orbit) and the
    // landed estimate; it stays below the stock Jool value (15).
    radiation_pause = -0.82
    radiation_surface = 9
}

// Subon has no independent global field.
// At ~1.67 Jot radii, its orbit lies inside Jot's inner belt: ~80-120 rad/h
// along the orbit (~120 rad/h mean including Jot's emitter). An intentionally
// severe destination: ~4 h to the 50 rad threshold at full shielding with
// 90% shielding efficiency, before prior exposure and per-kerbal variance.
RadiationBody:NEEDS[QuackPack,Kerbalism,FeatureRadiation]
{
    name = Subon
    radiation_surface = 0
}

RadiationBody:NEEDS[QuackPack,Kerbalism,FeatureRadiation]
{
    name = Cind
    radiation_model = QP_Cind

    radiation_inner = 10
    radiation_inner_gradient = 3.3

    // Compact outer belt compared with Jot.
    radiation_outer = 1.5
    radiation_outer_gradient = 2.2

    // Despite Cind's strong intrinsic dynamo, the close stellar environment
    // severely compresses its magnetosphere: T ~0.50. Sunlit and outside the
    // belts this leaves ~1.9 rad/h (quiet Sun, apoapsis) to ~5 rad/h (active
    // Sun, periapsis); the permanent nightside does not see the star.
    // No intrinsic surface radiation source.
    radiation_pause = -2.5
    radiation_surface = 0
}
