// ============================================================================
// QuackPack radiation fields for Kerbalism
//
// Geometry values are in body radii measured from the body centre.
// Radiation values are in rad/hour.
//
// Design basis:
// - Blas: weak/moderate dynamo; metal-poor super-Kerbin.
// - Jot: strong giant-planet dynamo, strongly compressed by stellar wind.
// - Cind: metal-rich, rapidly synchronous world; strong intrinsic dynamo but
//         very strongly compressed by the stellar wind.
// - Geet/Subon: no independent global field; they inherit parent-chain fields.
// ============================================================================


// ============================================================================
// BLAS
// Radius: 811 km
// Rotation: ~17.13 h
// Nominal field assumption: ~0.15 G equatorial
// Nominal dayside magnetopause target: ~4.17 Rp
// pause_radius / pause_compression = 6.05 / 1.45 = ~4.17 Rp
// Geet orbits at ~3.62 Blas radii, therefore normally inside the magnetopause.
// ============================================================================

RadiationModel:NEEDS[QuackPack,Kerbalism,FeatureRadiation]
{
    name = QP_BlasWeakField

    has_inner = true
    inner_dist = 1.60
    inner_radius = 0.40
    // Approx. belt span before deformation: 1.20 - 2.00 Rp

    inner_compression = 1.10
    inner_extension = 0.80
    inner_deform_xy = 1
    inner_quality = 30

    has_outer = false

    has_pause = true
    pause_radius = 6.05

    pause_compression = 1.45
    pause_extension = 0.20
    pause_height_scale = 1.10
    pause_quality = 20
}


// ============================================================================
// JOT
// Radius: 8,339 km
// Rotation: ~21.46 h
// Nominal field assumption: ~2 G equatorial
// Nominal dayside magnetopause target: ~8.48 Rp
// pause_radius / pause_compression = 11.45 / 1.35 = ~8.48 Rp
// Subon orbits at ~1.67 Jot radii, inside the inner radiation belt.
// ============================================================================

RadiationModel:NEEDS[QuackPack,Kerbalism,FeatureRadiation]
{
    name = QP_JotHotGiant

    has_inner = true
    inner_dist = 1.80
    inner_radius = 0.55
    // Approx. belt span before deformation: 1.25 - 2.35 Rp

    inner_compression = 1.08
    inner_extension = 0.80
    inner_deform_xy = 1
    inner_quality = 30

    has_outer = true
    outer_dist = 4.00
    outer_radius = 1.40
    // Approx. belt span before deformation: 2.60 - 5.40 Rp

    outer_compression = 1.15
    outer_extension = 0.65
    outer_deform_xy = 1
    outer_quality = 30

    has_pause = true
    pause_radius = 11.45

    pause_compression = 1.35
    pause_extension = 0.15
    pause_height_scale = 1.10
    pause_quality = 20
}


// ============================================================================
// CIND
// Radius: 571 km
// Tidally locked, but the close orbit still gives a ~24.1 h rotation period.
// Large metal core -> plausible active dynamo.
// Nominal field assumption: ~0.40 G equatorial
// Nominal dayside magnetopause target: ~3.89 Rp
// pause_radius / pause_compression = 6.80 / 1.75 = ~3.89 Rp
// Stellar wind is extreme, so the field is strongly asymmetric/compressed.
// ============================================================================

RadiationModel:NEEDS[QuackPack,Kerbalism,FeatureRadiation]
{
    name = QP_CindCompressedField

    has_inner = true
    inner_dist = 1.35
    inner_radius = 0.25
    // Approx. belt span before deformation: 1.10 - 1.60 Rp

    inner_compression = 1.20
    inner_extension = 0.75
    inner_deform_xy = 1
    inner_quality = 30

    has_outer = true
    outer_dist = 2.25
    outer_radius = 0.45
    // Approx. belt span before deformation: 1.80 - 2.70 Rp

    outer_compression = 1.30
    outer_extension = 0.70
    outer_deform_xy = 1
    outer_quality = 30

    has_pause = true
    pause_radius = 6.80

    pause_compression = 1.75
    pause_extension = 0.10
    pause_height_scale = 1.40
    pause_quality = 20
}


// ============================================================================
// RadiationBody definitions
// ============================================================================

RadiationBody:NEEDS[QuackPack,Kerbalism,FeatureRadiation]
{
    name = Blas
    radiation_model = QP_BlasWeakField

    radiation_inner = 0.6
    radiation_inner_gradient = 3.3

    // Magnetospheric protection. Applied before atmospheric gamma transparency.
    radiation_pause = -0.08
    radiation_surface = 0

    // No lore-supported magnetic tilt/offset is known, so keep it aligned.
    geomagnetic_pole_lat = 90
    geomagnetic_pole_lon = 0
    geomagnetic_offset = 0
}


// Geet has no independent global magnetosphere.
// Kerbalism still evaluates Blas and the Sun through the parent-body chain.
RadiationBody:NEEDS[QuackPack,Kerbalism,FeatureRadiation]
{
    name = Geet
    radiation_surface = 0
}


RadiationBody:NEEDS[QuackPack,Kerbalism,FeatureRadiation]
{
    name = Jot
    radiation_model = QP_JotHotGiant

    // Strong giant-planet belts, below stock Jool's 200 rad/h inner-belt value.
    radiation_inner = 120
    radiation_inner_gradient = 3.3

    radiation_outer = 15
    radiation_outer_gradient = 2.2

    // Stronger charged-particle shielding than stock Kerbin, but the close-in
    // stellar environment remains hazardous outside/within the belts.
    radiation_pause = -0.40
    radiation_surface = 0

    geomagnetic_pole_lat = 90
    geomagnetic_pole_lon = 0
    geomagnetic_offset = 0
}


// Subon is metal-rich but too small to require an independent global field.
// Its orbit (~1.67 Jot radii) naturally places it inside Jot's inner belt.
RadiationBody:NEEDS[QuackPack,Kerbalism,FeatureRadiation]
{
    name = Subon
    radiation_surface = 0
}


RadiationBody:NEEDS[QuackPack,Kerbalism,FeatureRadiation]
{
    name = Cind
    radiation_model = QP_CindCompressedField

    radiation_inner = 10
    radiation_inner_gradient = 3.3

    // Compact and weaker outer belt than Jot/Kerbin-style environments.
    radiation_outer = 1.5
    radiation_outer_gradient = 2.2

    // Cind receives an extreme stellar particle environment; a substantial
    // negative pause term represents protection by its compressed field.
    radiation_pause = -0.80
    radiation_surface = 0

    geomagnetic_pole_lat = 90
    geomagnetic_pole_lon = 0
    geomagnetic_offset = 0
}
